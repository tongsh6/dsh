id: refactor-04-error-handling
description: 用 Result 类型替换 throw/catch 错误处理模式
category: refactor
taskPrompt: |
  在 src/services/order.ts 中，createOrder 和 cancelOrder 函数当前使用 throw 来处理业务错误（库存不足、订单不存在、状态不允许取消等）。
  请重构为使用 Result<T, E> 模式，返回 { success: true, data: T } | { success: false, error: E }。

  Error 类型定义为：
  ```typescript
  type OrderError =
    | { code: "INSUFFICIENT_STOCK"; sku: string; available: number }
    | { code: "ORDER_NOT_FOUND"; orderId: string }
    | { code: "INVALID_STATUS"; current: string; expected: string };
  ```

  更新调用方（src/routes/order.ts, src/services/order.test.ts）以匹配新的返回类型。
expectedFiles:
  - src/services/order.ts
  - src/routes/order.ts
  - src/services/order.test.ts
expectPass: true
verificationCommands:
  - npx jest src/services/order.test.ts --no-coverage
  - npx tsc --noEmit
architectureRules:
  - Result 类型在 src/types/result.ts 中定义
  - 不要在 Result 模式中使用 throw（网络/DB 等不可控异常除外）
