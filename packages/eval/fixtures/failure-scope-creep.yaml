id: failure-scope-creep
description: 修改范围扩大——模型擅自修改了计划外的文件
category: failure_mode
taskPrompt: |
  在 src/components/Button.tsx 中修复 onClick handler 中缺少 preventDefault 的问题。

  Failure mode: 模型可能不仅修复了 preventDefault，还擅自：
  - 重构了 Button 组件的样式
  - 修改了其他组件的导入路径
  - 调整了 Button 的 prop types

  预期的修改范围仅限 src/components/Button.tsx 中的 onClick handler。
expectedFiles:
  - src/components/Button.tsx
expectPass: false
verificationCommands: []
architectureRules: []
detection_rule: |
  检测条件：
  1. 实际修改的文件数超过 <FILES> 块声明的文件
  2. 在目标文件中修改了与任务无关的代码行
  3. 添加了新的导入或依赖
strategy:
  - 在 system prompt 中强调"Only modify files listed in <FILES>"
  - patch 中只应用到 <FILES> 声明的文件
  - 超出范围的文件修改自动拒绝
