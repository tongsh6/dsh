id: feature-pagination
description: "为列表接口添加分页支持"
category: feature
taskPrompt: "为 GET /api/users 接口添加分页参数支持。接受 page 和 pageSize 查询参数，默认 page=1, pageSize=20。响应中包含 total, page, pageSize, data 字段。"
expectedFiles:
  - src/controllers/user-controller.ts
  - src/services/user-service.ts
expectPass: true
verifications:
  - type: file_exists
    file: src/controllers/user-controller.ts
    name: user_controller_file_exists
  - type: file_exists
    file: src/services/user-service.ts
    name: user_service_file_exists
  - type: shell
    command: "npx jest src/controllers/user-controller.test.ts"
    name: user_controller_tests_pass
  - type: shell
    command: "npx jest src/services/user-service.test.ts"
    name: user_service_tests_pass
  - type: shell
    command: "npx tsc --noEmit"
    name: typecheck_passes
architectureRules:
  - 分页逻辑在 service 层，controller 只做参数提取
  - 不修改 User 模型
  - 使用项目已有的数据库查询方式
maxRepairRounds: 3
expectedProtocolOperations:
  - PATCH
