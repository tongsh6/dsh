id: rh-refactor-branch-orchestrator
description: 提取三个服务中重复的 Git 分支操作逻辑
category: refactor
taskPrompt: |
  CodeMergeService、ReleaseBranchService、AttachAppService 三个服务中存在大量重复的 Git 分支操作逻辑：
  1. 遍历迭代关联的仓库
  2. 根据 GitProvider 获取对应的 GitBranchPort 适配器
  3. 检查分支是否存在
  4. 创建分支
  5. 执行合并操作
  6. 统一的异常处理和日志记录

  请提取一个 BranchOperationOrchestrator 组件，将公共逻辑封装起来：
  - 在 io.releasehub.application.release 包下新增 BranchOperationOrchestrator
  - 将"获取适配器 → 检查分支状态 → 创建/合并分支 → 异常处理"的通用流程抽象为可复用方法
  - 重构三个现有服务，让它们调用新的共享组件
  - 确保所有现有测试仍然通过
  - 为新的共享组件编写单元测试

  相关文件：
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/BranchOperationOrchestrator.java（新建）
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/CodeMergeService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/ReleaseBranchService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/window/AttachAppService.java
  - backend/releasehub-application/src/test/java/io/releasehub/application/release/BranchOperationOrchestratorTest.java（新建）

  项目使用 Maven 构建，Java 21，JUnit 5 + Mockito + AssertJ。六边形架构（DDD）。
expectedFiles:
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/BranchOperationOrchestrator.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/CodeMergeService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/ReleaseBranchService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/window/AttachAppService.java
  - backend/releasehub-application/src/test/java/io/releasehub/application/release/BranchOperationOrchestratorTest.java
expectPass: true
verificationCommands:
  - "cd backend && mvn test -pl releasehub-application -q"
architectureRules:
  - 新组件必须在 io.releasehub.application 包
  - Application 层只能依赖 Domain 和 Common
  - 不能依赖 Infrastructure、Interfaces 或 Bootstrap
  - 使用构造器注入，不使用字段注入
maxRepairRounds: 2
benchmarkRef:
  repo: release-hub
  branch: dsh-benchmark/release-hub-phase2
  commit: 180de500e6740433b578e60e1585dc6e315f5191
preflightFiles:
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/CodeMergeService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/release/ReleaseBranchService.java
  - backend/releasehub-application/src/main/java/io/releasehub/application/window/AttachAppService.java
designGoal: 验证 Java 多服务重构中新增 orchestrator 并替换重复分支操作逻辑的 CREATE+PATCH 能力
verificationGoal: releasehub-application Maven 测试通过，证明应用层依赖边界和现有服务行为未被破坏
expectedProtocolOperations:
  - CREATE
  - PATCH
