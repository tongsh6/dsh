id: loam-docs-provider-readme
description: 补充 LLM Provider 的使用文档
category: docs
taskPrompt: |
  项目的 packages/distill/src/providers/ 目录包含 5 个 LLM Provider（openai, anthropic, deepseek, ollama, openai-compatible），
  但缺少统一的使用文档说明如何配置和切换 Provider。

  请在 docs/ 目录下创建 docs/providers.md，包含以下内容：
  1. 支持的 Provider 列表及各自需要的 API Key 环境变量
  2. 每个 Provider 的配置示例（YAML 或 JSON 格式）
  3. Provider 切换方法（通过配置文件或环境变量）
  4. 自定义 Provider（openai-compatible）的使用说明

  参考 packages/distill/src/providers/shared.ts 中定义的配置接口来确保文档与代码一致。

  相关文件：docs/providers.md（新建）
expectedFiles:
  - docs/providers.md
expectPass: true
verificationCommands:
  - "test -f docs/providers.md"
architectureRules:
  - 文档内容必须与 shared.ts 中的配置接口一致
  - 不修改任何源代码文件
  - 使用中文撰写
maxRepairRounds: 1
repoPath: /tmp/dsh-candidate-loamlog
