id: pi-bugfix-count-defs
description: 修复 check_v2_constraints.py 中 count_definitions 的朴素子串匹配
category: bugfix
taskPrompt: |
  在 tools/check_v2_constraints.py 中，count_definitions() 函数使用 text.count(signature) 做朴素子串匹配，
  这会将注释、docstring、字符串字面量中的 def xxx( 也统计进去，产生假阳性或假阴性。

  请将 count_definitions() 改为只统计真实函数或方法声明行，匹配时必须允许 def 前存在缩进，
  以覆盖类方法定义；不要统计注释、docstring 或字符串字面量中的文本。find_pattern() 函数不需要修改。

  相关文件：tools/check_v2_constraints.py
expectedFiles:
  - tools/check_v2_constraints.py
expectPass: true
verifications:
  - type: file_contains
    file: tools/check_v2_constraints.py
    pattern: "^\\s*def"
    name: count_definitions_allows_indented_defs
  - type: shell
    command: python3 -m pytest tests/unit/domain/test_check_v2_constraints.py -v
    name: check_v2_constraints_tests_pass
architectureRules:
  - 不修改 check_v2_constraints.py 的 main() 函数和退出码约定
  - 不用 AST 解析，保持实现简单
  - count_definitions 的调用方式和返回值类型不变
  - 正则必须允许 def 前有缩进，以覆盖类方法定义
maxRepairRounds: 2
benchmarkRef:
  repo: pi-proof-forge
  branch: dsh-benchmark/pi-phase2
  commit: d01d427be7d2999b4d17783b8982bb518c53ec9f
preflightFiles:
  - tools/check_v2_constraints.py
  - tests/unit/domain/test_check_v2_constraints.py
designGoal: 验证单文件 bugfix 对已有朴素匹配逻辑做精准 SEARCH_REPLACE 的能力
verificationGoal: 定向 pytest 通过，证明 count_definitions 只统计真实行首 def 声明
expectedProtocolOperations:
  - PATCH
  - SEARCH_REPLACE
