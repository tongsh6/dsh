id: pi-refactor-read-text
description: 提取 extract_evidence.py 和 extract_evidence_llm.py 中重复的 read_text 函数
category: refactor
taskPrompt: |
  tools/extract_evidence.py 的 read_text() 函数（35-39 行）和 tools/extract_evidence_llm.py 的 read_text() 函数（18-21 行）
  实现完全相同：检查 path == "-"，是则读 stdin，否则读文件。

  请将 read_text() 提取到 tools/infra/file_io.py（新建文件），然后在两个源文件中删除本地实现，改为：
  from tools.infra.file_io import read_text

  确保 tools/infra/__init__.py 存在（如果不存在则创建空文件）。

  相关文件：tools/extract_evidence.py, tools/extract_evidence_llm.py, tools/infra/file_io.py(new)
expectedFiles:
  - tools/extract_evidence.py
  - tools/extract_evidence_llm.py
  - tools/infra/file_io.py
expectPass: true
verifications:
  - type: file_contains
    file: tools/extract_evidence.py
    pattern: "from tools.infra.file_io import read_text"
    name: evidence_import_read_text
  - type: file_contains
    file: tools/extract_evidence_llm.py
    pattern: "from tools.infra.file_io import read_text"
    name: llm_import_read_text
  - type: file_contains
    file: tools/infra/file_io.py
    pattern: "def read_text"
    name: file_io_has_read_text
  - type: shell
    command: python3 -m pytest tests/unit/domain/test_evidence_engines.py -v
    name: evidence_engine_tests
architectureRules:
  - read_text 的函数签名和目标行为完全不变
  - 不引入新的第三方依赖
  - file_io.py 只放 read_text，保持最小化
maxRepairRounds: 2
benchmarkRef:
  repo: pi-proof-forge
  branch: dsh-benchmark/pi-phase2
  commit: d01d427be7d2999b4d17783b8982bb518c53ec9f
preflightFiles:
  - tools/extract_evidence.py
  - tools/extract_evidence_llm.py
  - tests/unit/domain/test_evidence_engines.py
designGoal: 验证从两个真实工具模块抽取共享文件并更新 import 的 CREATE+PATCH 复合能力
verificationGoal: 证据引擎单元测试通过，证明 read_text 行为和调用方兼容性保持不变
expectedProtocolOperations:
  - CREATE
  - PATCH
