id: test-snapshot
description: "为 UI 组件添加快照测试"
category: test
taskPrompt: "为 Button 和 Input 组件添加快照测试。覆盖：默认状态、disabled 状态、loading 状态、error 状态、不同 size（small/medium/large）、不同 variant（primary/secondary/ghost）。"
expectedFiles:
  - src/components/__snapshots__/button.snap
  - src/components/__snapshots__/input.snap
  - src/components/button.test.tsx
  - src/components/input.test.tsx
expectPass: true
verifications:
  - type: file_exists
    file: src/components/__snapshots__/button.snap
    name: button_snapshot_file_exists
  - type: file_exists
    file: src/components/__snapshots__/input.snap
    name: input_snapshot_file_exists
  - type: file_exists
    file: src/components/button.test.tsx
    name: button_test_file_exists
  - type: file_exists
    file: src/components/input.test.tsx
    name: input_test_file_exists
  - type: shell
    command: "npx jest src/components/button.test.tsx src/components/input.test.tsx"
    name: component_snapshot_tests_pass
  - type: shell
    command: "npx tsc --noEmit"
    name: typecheck_passes
architectureRules:
  - 使用项目已有的测试框架和快照工具
  - 不修改组件实现
  - 快照文件需要提交
maxRepairRounds: 2
expectedProtocolOperations:
  - CREATE
