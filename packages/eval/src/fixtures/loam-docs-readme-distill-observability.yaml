id: loam-docs-readme-distill-observability
description: 在 README.md 的 Architecture 章节后插入 Distill Observability 章节
category: docs
taskPrompt: |
  在 README.md 的 `## Architecture` 章节之后、`## Current Direction` 之前，插入一个新的 `## Distill Observability` 章节。

  该章节应包含以下内容：
  1. **Distill DAG** — DAG 执行引擎的观测点（节点状态、依赖关系、执行耗时）
  2. **State KV** — 状态存储的观测点（读写次数、键值大小、持久化延迟）
  3. **Evidence** — 三类证据（pitfall-card、issue-draft、knowledge-card）的生成数量与通过率

  参考 packages/distill/src/state.ts 中的 State 接口和 engine.ts 中的 DAG 执行逻辑来补充技术细节。

  不修改其他章节，不修改任何源代码。

  相关文件：README.md（局部修改）
expectedFiles:
  - README.md
expectPass: true
verificationCommands:
  - "grep -q '^## Distill Observability' README.md"
  - "awk '/^## Architecture/{seen=1} seen && /^## Distill Observability/{found=1} /^## Current Direction/{exit found ? 0 : 1}' README.md"
architectureRules:
  - 只在 ## Architecture 和 ## Current Direction 之间插入新章节
  - 不修改其他章节内容
  - 不修改任何源代码文件
maxRepairRounds: 2
benchmarkRef:
  repo: loamlog
  branch: dsh-benchmark/loamlog-phase2
  commit: 5e1d3ee57e853698beacd51f4d1a674f293c17d8
preflightFiles:
  - README.md
  - packages/distill/src/state.ts
  - packages/distill/src/engine.ts
designGoal: 验证 INSERT 在大型 tracked markdown 文件中基于稳定标题插入新章节的能力
verificationGoal: README.md 中 ## Distill Observability 章节出现在 ## Architecture 之后、## Current Direction 之前
expectedProtocolOperations:
  - INSERT
